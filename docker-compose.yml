# 通用耐久执行底座 — 中文显示名见 materials/xinao_compose_display_names.v1.json
# 启动：docker compose up -d --build
# 或：docker compose up -d
name: xinao-base

services:
  shiwu-ku:
    image: postgres:16-alpine
    container_name: shiwu-ku
    labels:
      xinao.display_cn: "事务库"
      xinao.role_cn: "耐久事务PostgreSQL"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=off
    volumes:
      - shiwu-ku-data:/var/lib/postgresql/data
    networks:
      - xinao_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  naijiu-shiwu:
    image: temporalio/server:1.31.0
    pull_policy: never
    container_name: naijiu-shiwu
    labels:
      xinao.display_cn: "耐久事务"
      xinao.role_cn: "Temporal Server :7233"
      xinao.mature_source: "temporalio/samples-server@ca1106b647c34323876bd6f221f4310271096dd8"
      xinao.image_content_sha256: "b021b3b58c3f169634cdbb0451fcc0e69e8190b40454323362c7c52bbd4ff7b9"
    depends_on:
      shiwu-ku:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: shiwu-ku
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/xinao-production.yaml
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "7233:7233"
    networks:
      - xinao_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  shiwu-mianban:
    image: temporalio/ui:2.49.1
    pull_policy: never
    container_name: shiwu-mianban
    labels:
      xinao.display_cn: "事务面板"
      xinao.role_cn: "Temporal UI :8080"
    depends_on:
      naijiu-shiwu:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: naijiu-shiwu:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:8080
    ports:
      - "8080:8080"
    networks:
      - xinao_internal
    restart: unless-stopped

  moxing-wangguan:
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm:main-latest
    container_name: moxing-wangguan
    env_file:
      - path: .env
        required: false
    labels:
      xinao.display_cn: "模型网关"
      xinao.role_cn: "LiteLLM :20128"
    ports:
      - "127.0.0.1:20128:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ./materials/thin_glue_litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - xinao_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)\""]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  houtai-gongren:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/houtai-gongren/Dockerfile
    image: xinao-houtai-gongren:docker-native-grok46-20260813
    container_name: houtai-gongren
    # Grok's Linux Landlock sandbox opens /dev/tty even for headless lanes.
    # Allocate the service PTY without keeping stdin open so sandboxed workers
    # fail closed on policy violations instead of failing before execution.
    tty: true
    # The inner bwrap wrapper is intentionally fail-closed unless the outer
    # container has only the identity-switch capabilities it needs and cannot
    # gain any new privileges.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile blocks the unprivileged user
      # namespace that Grok's inner bubblewrap sandbox must bootstrap. The
      # worker retains NNP and only SETUID/SETGID; daemon readiness proves the
      # nested sandbox actually starts before this service can become healthy.
      - seccomp=unconfined
    labels:
      xinao.display_cn: "后台工人"
      xinao.role_cn: "可选 Docker Grok 工人"
    depends_on:
      naijiu-shiwu:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      XINAO_RESEARCH_RUNTIME: /evidence
      XINAO_CODEX_S_REPO_ROOT: /app
      XINAO_S_RUNTIME_RELEASE_COMMIT: ${XINAO_S_RUNTIME_RELEASE_COMMIT:-}
      XINAO_S_RUNTIME_RELEASE_MANIFEST_SHA256: ${XINAO_S_RUNTIME_RELEASE_MANIFEST_SHA256:-}
      PYTHONPATH: /app:/app/src
      TEMPORAL_ADDRESS: naijiu-shiwu:7233
      XINAO_EXTERNAL_MATURE_ROOT: /external_mature/official
      XINAO_GROK_DOCKER_NATIVE: "1"
      XINAO_GROK_BIN: /usr/local/bin/grok
      XINAO_GROK_HOME: /grok-home
      GROK_HOME: /grok-home/.grok
      XINAO_GROK_DEFAULT_MODEL: grok-4.6
    volumes:
      - ${XINAO_EVIDENCE_HOST:-D:/XINAO_RESEARCH_RUNTIME}:/evidence
      - ${XINAO_CODEX_S_REPO_HOST:-.}/AGENTS.md:/app/AGENTS.md:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/services:/app/services:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/projects:/app/projects:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/scripts:/app/scripts:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/docs:/app/docs:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/evals:/app/evals:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/pyproject.toml:/app/pyproject.toml:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/uv.lock:/app/uv.lock:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/tests:/app/tests:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/materials:/app/materials:ro
      - ${XINAO_CODEX_S_REPO_HOST:-.}/policies:/app/policies:ro
      - ${XINAO_EXTERNAL_MATURE_HOST:-E:/XINAO_EXTERNAL_MATURE/codex_20260627/official}:/external_mature/official:ro
      - ${XINAO_GROK_WORKER_HOME_HOST:-C:/Users/xx363/.grok-bg-workers}:/grok-home/.grok
      # The shared Windows profile relocates sessions to this exact Linux path.
      # Bind only that D-disk store so the existing link resolves in-container;
      # do not expose a broader host drive.
      - ${XINAO_GROK_SESSION_STORE_HOST:-D:/XINAO_RESEARCH_RUNTIME/state/tool_profile_sessions/grok-bg-workers}:/mnt/host/d/XINAO_RESEARCH_RUNTIME/state/tool_profile_sessions/grok-bg-workers:rw
    networks:
      - xinao_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "services.agent_runtime.integrated_bus_worker_daemon", "--runtime-root", "/evidence", "--check-readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  bendi-moxing:
    image: ollama/ollama:latest
    container_name: bendi-moxing
    labels:
      xinao.display_cn: "本地模型"
      xinao.role_cn: "Ollama可选"
    ports:
      - "11434:11434"
    volumes:
      - bendi-moxing-data:/root/.ollama
    networks:
      - xinao_internal
    restart: unless-stopped
    profiles:
      - ollama

  waiwang-sousuo:
    profiles: ["search"]
    image: searxng/searxng:latest
    container_name: waiwang-sousuo
    labels:
      xinao.display_cn: "外网搜索"
      xinao.role_cn: "SearXNG元搜索 :8888"
    ports:
      - "8888:8080"
    environment:
      SEARXNG_BASE_URL: http://waiwang-sousuo:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-xinao-searxng-local-secret}
    volumes:
      - ./materials/searxng:/etc/searxng:ro
    networks:
      - xinao_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8080/search?q=ping&format=json' | grep -q url"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  xinao_internal:
    name: xinao_internal
  xinao_sandbox_control:
    name: xinao_sandbox_control_v1
    internal: true

volumes:
  shiwu-ku-data:
  bendi-moxing-data:
