# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Disposable native Codex subagent Owner-worker-consumer trajectory

providers:
  - id: openai:codex-app-server
    config:
      working_dir: '{{env.XINAO_NATIVE_SUBAGENT_WORKSPACE}}'
      sandbox_mode: workspace-write
      approval_policy: never
      ephemeral: true
      reuse_server: false
      cli_config:
        features:
          hooks: false
          multi_agent: true
          multi_agent_v2: true
      thread_cleanup: unsubscribe
      inherit_process_env: false
      include_raw_events: true
      turn_timeout_ms: 600000
      codex_path_override: '{{env.CODEX_APP_SERVER_PATH}}'
      cli_env:
        CODEX_HOME: '{{env.CODEX_HOME}}'
        PYTHONDONTWRITEBYTECODE: '1'
        HTTP_PROXY: '{{env.HTTP_PROXY}}'
        HTTPS_PROXY: '{{env.HTTPS_PROXY}}'
        ALL_PROXY: '{{env.ALL_PROXY}}'
        NO_PROXY: '{{env.NO_PROXY}}'
      output_schema:
        type: object
        additionalProperties: false
        required:
          - case_id
          - owner_anchor
          - worker_alpha
          - delegated_threads
          - consumer_marker
          - followup_nonce
          - adoption_status
          - status
        properties:
          case_id: { type: string }
          owner_anchor: { type: string }
          worker_alpha: { type: integer }
          delegated_threads: { type: integer }
          consumer_marker: { type: string }
          followup_nonce: { type: string }
          adoption_status: { type: string }
          status: { type: string }

prompts:
  - prompt.txt

tests:
  - description: Parent owns reality while one native child does a separable read
    assert:
      - type: is-json
      - type: javascript
        value: file://assert_trajectory.js
