- description: Missing live local evidence preserves unknown instead of inventing a gap
  vars:
    case_id: REG_MISSING_LOCAL_BASELINE_PRESERVES_UNKNOWN
    parent_context: >-
      The user is deciding whether an external scheduling feature should change the current local
      architecture.
    user_increment: 查清楚外面这个能力对我们到底有没有用。
    local_baseline: The active configuration and real consumer state are temporarily unreadable.
    external_evidence: A primary source verifies the external scheduler feature and its limits.
    expected_research_mode: open_parent_grounded
    expected_scope_source: parent_and_live_context
    expected_local_baseline_required: true
    expected_coverage_expansion_required: true
    expected_local_collision_required: true
    expected_external_classification: unknown
    expected_next_action: read_local_before_classifying
    expected_stop_basis: not_ready_local_baseline_unknown

- description: Repeated properties and complete collision justify marginal-information stop
  vars:
    case_id: REG_MARGINAL_NOVELTY_STOP
    parent_context: >-
      The user is deciding whether to replace a verified local queue with an external queue.
    user_increment: 继续查到真正够判断为止，别为了全量无限查。
    local_baseline: >-
      The current queue meets the named durability and latency consumer requirements and has a fresh
      recovery test; migration cost and rollback are known.
    external_evidence: >-
      Primary implementation, independent failure reports, mechanism comparison, and alternatives
      are covered. The last two searches only repeated already classified properties; the remaining
      unknown does not change the current no-migration decision.
    expected_research_mode: open_parent_grounded
    expected_scope_source: parent_and_live_context
    expected_local_baseline_required: true
    expected_coverage_expansion_required: false
    expected_local_collision_required: true
    expected_external_classification: alternative
    expected_next_action: stop_and_synthesize
    expected_stop_basis: decision_coverage_and_marginal_novelty

- description: Explicit Stop defeats historical preference for open research
  vars:
    case_id: NEG_EXPLICIT_STOP_BLOCKS_SEARCH
    parent_context: A prior turn considered building a general external-reality research capability.
    user_increment: 先只讨论，不要搜索、不要读文件、不要派工、不要修改。
    local_baseline: No new local read is authorized in this turn.
    external_evidence: No new external read is authorized in this turn.
    expected_research_mode: stopped
    expected_scope_source: current_stop
    expected_local_baseline_required: false
    expected_coverage_expansion_required: false
    expected_local_collision_required: false
    expected_external_classification: not_applicable
    expected_next_action: preserve_stop
    expected_stop_basis: explicit_stop
