# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Parent-grounded external reality research regressions

providers:
  - id: openai:codex-app-server
    config:
      working_dir: ../..
      sandbox_mode: read-only
      approval_policy: never
      ephemeral: true
      reuse_server: false
      cli_config:
        features:
          hooks: false
      thread_cleanup: unsubscribe
      inherit_process_env: false
      turn_timeout_ms: 120000
      codex_path_override: '{{env.CODEX_APP_SERVER_PATH}}'
      cli_env:
        CODEX_HOME: '{{env.CODEX_HOME}}'
        HTTP_PROXY: '{{env.HTTP_PROXY}}'
        HTTPS_PROXY: '{{env.HTTPS_PROXY}}'
        ALL_PROXY: '{{env.ALL_PROXY}}'
        NO_PROXY: '{{env.NO_PROXY}}'
      output_schema:
        type: object
        additionalProperties: false
        required:
          - case_id
          - research_mode
          - scope_source
          - utterance_is_automatic_task_boundary
          - local_baseline_required
          - coverage_expansion_required
          - local_collision_required
          - external_classification
          - next_action
          - stop_basis
          - fixed_search_quota
          - automatic_external_adoption
          - second_research_owner
          - reason
        properties:
          case_id: { type: string }
          research_mode:
            enum: [open_parent_grounded, narrow_bounded, supplied_material_only, stopped]
          scope_source:
            enum: [parent_and_live_context, user_explicit_narrow_scope, current_supplied_material, current_stop]
          utterance_is_automatic_task_boundary: { type: boolean, const: false }
          local_baseline_required: { type: boolean }
          coverage_expansion_required: { type: boolean }
          local_collision_required: { type: boolean }
          external_classification:
            enum: [already_present, true_delta, conflict, alternative, noise, unknown, not_applicable]
          next_action:
            enum: [expand_search_then_collide, read_local_before_classifying, direct_bounded_lookup, adjudicate_supplied_material, stop_and_synthesize, preserve_stop]
          stop_basis:
            enum: [not_ready_decision_dimensions_open, not_ready_local_baseline_unknown, decision_coverage_and_marginal_novelty, one_bounded_fact_sufficient, supplied_material_sufficient, explicit_stop]
          fixed_search_quota: { type: boolean, const: false }
          automatic_external_adoption: { type: boolean, const: false }
          second_research_owner: { type: boolean, const: false }
          reason: { type: string, minLength: 1 }

prompts:
  - prompt.txt

defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: file://assert_behavior.js

tests: file://cases.yaml
