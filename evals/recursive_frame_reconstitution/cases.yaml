    parent_context: >-
      A fresh XINAO research subject has the latest first-hand human intent, chronology, live
      repository, rules, sparse output observations, current unknowns, and its own recent failures.
      No local scientific question has yet been named.
    current_action: I am about to select the easiest measurable anomaly and turn it into the task.
    user_increment: 先让整个现实进入你的计算；问题可以后来产生，不要先拿一个容易算的题替代世界。
    requested_work: Continue native XINAO research from the living whole.
    expected_active_object: xinao_whole_reality
    expected_next_behavior: compute_xinao_reality_directly
    expected_current_action_in_object: true
    expected_whole_reality_before_compression: true

