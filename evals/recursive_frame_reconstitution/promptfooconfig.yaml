# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Recursive frame reconstitution behavior regressions

providers:
  - id: openai:codex-app-server
    config:
      working_dir: ../..
      sandbox_mode: read-only
      approval_policy: never
      ephemeral: true
      reuse_server: false
      cli_config:
        features:
          hooks: false
      thread_cleanup: unsubscribe
      inherit_process_env: false
      turn_timeout_ms: 120000
      codex_path_override: '{{env.CODEX_APP_SERVER_PATH}}'
      cli_env:
        CODEX_HOME: '{{env.CODEX_HOME}}'
        HTTP_PROXY: '{{env.HTTP_PROXY}}'
        HTTPS_PROXY: '{{env.HTTPS_PROXY}}'
        ALL_PROXY: '{{env.ALL_PROXY}}'
        NO_PROXY: '{{env.NO_PROXY}}'
      output_schema:
        type: object
        additionalProperties: false
        required:
          - case_id
          - active_object
          - next_behavior
          - current_action_in_object
          - whole_reality_before_compression
          - question_is_mandatory_gateway
          - rigor_blocks_initial_perception
          - new_meta_control_plane
          - immediate_self_test
          - permanent_uptake_claim
          - self_inventory_precedes_xinao
          - cognition_history
          - next_action_summary
          - reason
        properties:
          case_id: { type: string }
          active_object:
            enum: [current_agent_action, xinao_whole_reality, claim_and_consequence, xinao_computation_topology, bounded_local_operation, current_stop]
          next_behavior:
            enum: [change_current_behavior_now, compute_xinao_reality_directly, strengthen_claim_boundary, leave_second_sol_unallocated, execute_bounded_operation, preserve_stop]
          current_action_in_object: { type: boolean }
          whole_reality_before_compression: { type: boolean }
          question_is_mandatory_gateway: { type: boolean, const: false }
          rigor_blocks_initial_perception: { type: boolean, const: false }
          new_meta_control_plane: { type: boolean, const: false }
          immediate_self_test: { type: boolean, const: false }
          permanent_uptake_claim: { type: boolean, const: false }
          self_inventory_precedes_xinao: { type: boolean, const: false }
          cognition_history:
            type: object
            additionalProperties: false
            required:
              - applicable
              - temporal_sequence_role
              - artifact_corpus_complete
              - newest_text_auto_wins
              - earlier_reasons_preserved
              - missing_dialogue_is_gap
              - current_understanding_reconstructed
            properties:
              applicable: { type: boolean }
              temporal_sequence_role:
                enum: [evolution_pointer, document_priority, not_applicable]
              artifact_corpus_complete: { type: boolean }
              newest_text_auto_wins: { type: boolean }
              earlier_reasons_preserved: { type: boolean }
              missing_dialogue_is_gap: { type: boolean }
              current_understanding_reconstructed: { type: boolean }
          next_action_summary: { type: string, minLength: 1 }
          reason: { type: string, minLength: 1 }

prompts:
  - prompt.txt

defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: file://assert_behavior.js

tests: file://cases.yaml
