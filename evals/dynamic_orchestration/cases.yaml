# Dynamic orchestration execution-shape regressions. Promptfoo reads this file directly.
# Metadata profiles support smoke/core/deep selection; profile orchestration runs all cases.

- description: Tight highly coupled authority edit stays owner-direct
  metadata:
    id: POS_TIGHT_COUPLED_AUTHORITY_OWNER_DIRECT
    domain: dynamic_orchestration
    class: positive_owner_direct
    profiles: [smoke, core, deep]
    source_type: positive_control
    source_ref: tool-glue-constitution/section-3
    lifecycle: regression
    added_at: 2026-07-27
    not_authority: true
  vars:
    case_id: POS_TIGHT_COUPLED_AUTHORITY_OWNER_DIRECT
    domain: dynamic_orchestration
    restored_context: >-
      One tightly coupled formal authority edit is ready. The write lands on a shared
      authority surface, shares live owner context with the surrounding integration, and
      any split would create a write-domain or pin collision. No independent sealable
      package has positive net benefit after freeze and fan-in cost. External workers are
      healthy but irrelevant for this inseparable owner slice.
    user_increment: >-
      Apply the exact authority edit and finish the owner verification. Do not invent
      worker lanes, fixed width, or a second writer.
    expected_execution_shape: owner_direct
    expected_worker_count: 0
    expected_carrier_kind: none
    expected_owner_authority: codex_only
    expected_worker_effect: not_applicable
    expected_outside_domain: not_applicable
    expected_integration_gate: owner_direct_completion
    expected_recompute_scope: none
    expected_codex_subagent_default: false
    expected_readonly_worker_counted: false
    expected_valueless_parallelism: false
    expected_worker_self_promotes: false
    expected_formal_writer: codex_main

