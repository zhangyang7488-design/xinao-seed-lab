# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Dynamic orchestration execution-shape regressions

providers:
  - id: openai:codex-app-server
    config:
      working_dir: ../..
      sandbox_mode: read-only
      approval_policy: never
      ephemeral: true
      # Each case owns and closes its app-server process tree. Reusing one
      # server across ephemeral cases accumulates MCP children on Windows.
      reuse_server: false
      # Eval-owned fresh sessions are intentionally hook-free so their
      # lifecycle does not leak repeated SessionStart entries into the UI.
      cli_config:
        features:
          hooks: false
      thread_cleanup: unsubscribe
      inherit_process_env: false
      turn_timeout_ms: 360000
      codex_path_override: '{{env.CODEX_APP_SERVER_PATH}}'
      cli_env:
        CODEX_HOME: '{{env.CODEX_HOME}}'
        HTTP_PROXY: '{{env.HTTP_PROXY}}'
        HTTPS_PROXY: '{{env.HTTPS_PROXY}}'
        ALL_PROXY: '{{env.ALL_PROXY}}'
        NO_PROXY: '{{env.NO_PROXY}}'
      output_schema:
        type: object
        additionalProperties: false
        required:
          - case_id
          - execution_shape
          - worker_count
          - carrier_kind
          - owner_authority
          - worker_effect
          - outside_domain
          - integration_gate
          - recompute_scope
          - codex_subagent_default
          - readonly_worker_counted
          - valueless_parallelism
          - worker_self_promotes
          - formal_writer
          - reason
        properties:
          case_id: { type: string }
          execution_shape:
            enum:
              - owner_direct
              - single_ordinary_package
              - multiple_ordinary_packages
              - single_isolated_container_branch
              - multiple_isolated_container_branches
              - no_action
          worker_count: { type: integer, minimum: 0, maximum: 8 }
          carrier_kind:
            enum:
              - none
              - ordinary_sealed_package
              - isolated_container_branch
          owner_authority: { type: string, const: codex_only }
          worker_effect:
            enum:
              - not_applicable
              - candidate_read_write_test_in_domain
          outside_domain:
            enum:
              - not_applicable
              - denied
          integration_gate:
            enum:
              - owner_direct_completion
              - codex_verify_adopt_formal_write_effect_verify
              - candidate_ready_waiting_owner
              - no_action
          recompute_scope:
            enum:
              - none
              - remaining_dag
              - failed_dependency_cone
          codex_subagent_default: { type: boolean }
          readonly_worker_counted: { type: boolean }
          valueless_parallelism: { type: boolean }
          worker_self_promotes: { type: boolean }
          formal_writer: { type: string, const: codex_main }
          reason: { type: string, minLength: 1 }

prompts:
  - prompt.txt

defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: file://assert_behavior.js

tests: file://cases.yaml
