    domain: continuity
    restored_context: 'A qualified fresh Codex window owns the active continuous science mainline in interactive

      leg A. The stable mainline entry, tool-glue constitution, working agreement and personal

      decision model have been read. The previous window''s best verified baseline is a clear

      execution-contract-driven trajectory: it restored the real parent, used bounded direct Grok

      labor, kept Codex as sole Owner, verified real effects and returned every local terminal to

      the science frontier. One earlier opening was visibly scattered, and two later decoding

      failures reduced the user''s requested trajectory evolution first to recovery and then to

      optional permission. The user corrected the final distinction explicitly: when stable intent,

      applicable contracts, live facts and dynamic net benefit prove one bounded reversible

      same-object and same-topology positive action with no material business or external-effect

      fork, implementation is a standing positive duty; doing nothing, merely explaining,

      recording, queueing, re-requesting authority or deferring to another window is a contract

      violation. Decision Skill may classify whether that user-granted scope matches, but does not

      originate or enlarge it.


      A bounded mature comparison has already changed the design. Google Research''s 2026

      ReasoningBank work supports extracting transferable reasoning strategies from both successful

      and failed trajectories instead of storing raw action logs or successful recipes only. Its

      released repository is research/demo code and explicitly not a production product, so the

      accepted delta is the reasoning pattern, not installing a ReasoningBank platform. The exact

      existing landing surfaces are already identified: the stable startup entry, the unique

      tool-glue constitution, the existing authorization boundary, the qualitative decision model

      and the existing changed-context behavior-regression suite. No daemon, scheduler, second

      memory store, full-transcript loader, second Owner or new project is required.


      Opening work must start from the best verified behavior, inspect only the minimum sufficient

      prior success, failure, user correction, Owner choice and real-effect slice, and derive at most

      one hypothesis capable of changing this window''s choice. If no supported gain exists, it keeps

      the baseline and advances the science parent immediately. A candidate is promoted only after a

      later real or changed-context trajectory shows earlier parent-result recovery, fewer aimless

      actions or repeated explanations, and no lower completion bar; contrary evidence withdraws it

      while preserving the negative trajectory. The meta-loop cannot block or replace the science

      parent.


      Neutral candidate pool:

      ATOM_CURRENT_BEST_BEHAVIOR_BASELINE=start from the best currently verified behavior rather

      than treating recovery from scatter as the target;

      ATOM_BOUNDED_MINIMUM_TRAJECTORY_REVIEW=read only the minimum sufficient prior-window success,

      failure, correction, Owner-choice and effect slice;

      ATOM_AT_MOST_ONE_CHOICE_CHANGING_HYPOTHESIS=derive at most one opening improvement that can

      actually change the current choice;

      ATOM_MATURE_COMPARISON_ALREADY_CHANGED_DESIGN=reuse the adopted ReasoningBank pattern and its

      explicit non-production limitation without repeating research or installing its demo stack;

      ATOM_NO_SUPPORTED_GAIN_KEEP_BASELINE_AND_ADVANCE=when evidence does not support an uplift,

      retain the baseline and immediately advance the active science parent;

