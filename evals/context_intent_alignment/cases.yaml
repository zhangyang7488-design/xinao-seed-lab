- description: A mature XINAO capability is exercised by real actors before more readiness work
  metadata:
    id: REG_MATURE_XINAO_RUNS_REAL_ACTORS_BEFORE_AUDIT_PROXY
    domain: intent_decoding
    class: real_use_first_changed_context_regression
    profiles: [smoke, core, deep]
