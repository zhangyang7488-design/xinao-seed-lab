    domain: behavior_repair
    restored_context: Across unrelated tasks and fresh windows, the user has repeatedly had to stop the assistant,
      restore the human parent result, explain that reports and local green checks are not outcomes, add exceptions,
      and grant the same chain-internal implementation details again. Four supplied text files mix real incidents
      with old history, ungoverned proposals, and worker-call examples; they are symptom evidence, not specifications
      or authority. Existing task-facing, Decision, technical-user, and supervisor Skills each cover part of the
      chain, but no work identity owns incident reconstruction through the correct behavior consumer and changed-context
      verification. The user now explicitly delegates the complete in-scope repair, installation, testing, rollback,
