    source_ref: current-user-2026-07-22/default-existing-repo-close-and-hygiene
    lifecycle: regression
    added_at: '2026-07-22'
    not_authority: true
  vars:
    case_id: REG_WORK_UNIT_LANDS_EFFECT_THEN_RETIRES_CARRIER
    domain: work_unit_lifecycle
    restored_context: 'The user asked Codex to implement and finish one named transaction in an existing repository.
      That repository already has an authorized remote and PR/merge workflow, and the user did not request local-only,
      no-publish, pause, or stop. The sealed transaction is isolated in one temporary worktree and branch and has
      passed local tests, but it has not been committed, pushed, merged, read back from remote main, or exercised
      by the required real consumer. The original main worktree has an independently recorded pre-transaction baseline
      that may include unrelated user changes. A task-scoped test container and generated evidence residue also
