      ATOM_META_LOOP_CANNOT_REPLACE_SCIENCE=keep the science active-parent and leg-A Owner unchanged;

      ATOM_FAILURE_TRACE_PRESERVED=retain the recovery-versus-evolution and permission-versus-duty

      decoding failures even after the corrected behavior passes;

      ATOM_REQUIRE_CURRENT_USER_REAUTHORIZATION=wait for the user to restate this stable grant in the

      current window before any improvement can land;

      ATOM_RECOVERY_BASELINE_IS_END=treat merely returning from a scattered opening to the prior

      baseline as the evolution target;

      ATOM_FORCE_META_CHANGE_EVERY_WINDOW=manufacture one rule or mutation in every window even when

      no positive gain is supported;

      ATOM_INSTALL_REASONINGBANK_PLATFORM=install the research/demo repository or create a second

      memory platform because its paper supplied a useful design pattern;

      ATOM_SELF_REVIEW_COUNTS_AS_EFFECT=let a reflection note, memory entry, contract sentence or

      self-judged PASS prove behavioral improvement;

      ATOM_META_LOOP_BLOCKS_SCIENCE=finish the evolution review before any useful science action may

      proceed;

      ATOM_FULL_TRANSCRIPT_RELOAD=load the whole prior conversation or action history at every

      opening;

