    expected_coordination_mode: single_supervisor_worker|supervisor_only
    expected_worker_provider: external_worker|not_applicable
    expected_worker_transport: adaptive|direct_batch|not_applicable
    expected_quota_action: query_now|not_applicable
    expected_quota_query_disposition: query_now_before_routing|not_applicable
    expected_owner_execution_state: dynamic_supervisor|inseparable_owner_slice
    expected_terminal_refill: not_applicable
    expected_worker_receipt_disposition: not_applicable
    expected_text_writer: codex_main
    expected_completion_claim_scope: not_applicable
    expected_local_completion_transition: finish_bounded_task
    expected_continuous_run_disposition: not_applicable
    expected_frontier_disposition: execute
    expected_candidate_value: positive
