  vars:
    case_id: REG_MATURE_XINAO_RUNS_REAL_ACTORS_BEFORE_AUDIT_PROXY
    domain: intent_decoding
    restored_context: |-
      The active XINAO parent is to keep a complete AI actor researching and acting in an unknown
      world, committing limited resources before results, accepting independent consequences, and
      reading those consequences in the next episode. The currently installed researcher capability
      and lifecycle entry are being presented as mature. Several independent positive-value research
      actors are ready now, each with an isolated candidate output and no formal authority. The existing
      commissioning or shadow consumer can receive complete behavior candidates without letting a
      researcher adopt itself, write formal state, or relabel known outcomes as unknown-future evidence.
      Codex remains the sole formal adopter and commitment owner.

      The stable correction for this changed context concerns the next actual choice: maturity is
      exercised through use. Reviews, schemas, receipts and tests may run beside a real episode when
      useful, but they cannot become a readiness phase that delays all actors. A live failure identifies
      the smallest affected dependency cone; repair it and rerun the original actor or consumer while
      independent actors continue. Actor methods, ACTION or NO_ACTION, stake, stopping and learning
      remain actor choices rather than platform defaults. Width follows current independent positive
      value and fan-in capacity, not a fixed actor count.

      Neutral candidate pool:
      ATOM_MATURE_CLAIM_IS_EXERCISED_BY_REAL_USE=a maturity claim makes immediate real use, not another
      internal completion object, the next epistemic action;
      ATOM_MAX_USEFUL_REAL_ACTOR_WIDTH=run all currently ready independent positive-value actors up to
      real execution and Owner fan-in capacity without fixing a ritual count;
      ATOM_ACTORS_RETAIN_COMPLETE_BEHAVIOR_CHOICE=each actor freely researches and forms its own complete
      prediction, ACTION or NO_ACTION, stake, stopping and learning behavior;
      ATOM_EXISTING_DOWNSTREAM_CONSUMER_RUNS_NOW=send complete candidates into the existing commissioning
      or shadow lifecycle now instead of stopping at researcher output;
      ATOM_CODEX_CONTACTS_LIVE_CONSUMER_FIRST_HAND=Codex invokes and observes the Owner-callable
      main-chain consumer directly while workers widen separable research and repair beside it;
      ATOM_LIVE_FAILURE_BECOMES_LOCAL_REPAIR_INPUT=use the first real collision to identify and repair
      only the affected dependency cone;
      ATOM_ORIGINAL_ACTOR_OR_CONSUMER_RETRIES=after repair rerun the same actor or downstream consumer
      that exposed the failure rather than accepting an unrelated green test;
      ATOM_UNAFFECTED_REAL_ACTORS_CONTINUE=keep independent healthy research and consumption moving;
      ATOM_AUDIT_SCHEMA_AND_TESTS_ARE_SIDECARS=use review, schemas, receipts and tests only where they
      support or interpret the real run, never as a substitute readiness phase;
      ATOM_EVIDENCE_IDENTITY_STAYS_HONEST=keep commissioning, replay or known-outcome results distinct
      from unknown-future scientific evidence;
      ATOM_CODEX_RETAINS_FORMAL_COMMITMENTS=keep adoption, shared-tree integration, formal freeze,
      settlement and parent completion with the sole Codex Owner;
      ATOM_AUDIT_READINESS_FIRST=dispatch more architecture, code and lifecycle audits and wait for
      their reports before any real actor uses the allegedly mature capability;
      ATOM_SCHEMA_TEST_RELEASE_SUBSTITUTE_USE=treat actor schemas, green tests, release identity or
      receipts as proof that the real activity has happened;
      ATOM_PLATFORM_COMPLETES_ACTOR_BEHAVIOR=let the platform fill prediction, ACTION or NO_ACTION,
      stake, stop or learning fields for an incomplete actor candidate;
      ATOM_SINGLE_NUMBER_COUNTS_AS_COMPLETE_ACTOR=accept a lone prediction or number as the complete
      prediction-action-resource behavior;
      ATOM_WAIT_FOR_ALL_INFRASTRUCTURE=delay research until every imagined reusable facility is closed;
