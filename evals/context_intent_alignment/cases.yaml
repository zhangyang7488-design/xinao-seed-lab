    domain: continuity
    restored_context: 'The active XINAO science parent and its unrelated ResearchFrontier packages remain live.
      Two

      independent deterministic actions appear during one bounded episode. Current evidence proves

      action A is a legal one-off action with no next same-condition production reuse; it is therefore

      NOT_REQUIRED for maturation and may proceed as an ordinary bounded, reversible action under its

      existing contract. It does not acquire mature-capability identity or create a capability debt.


      For action B, the real consumer may recur, but its stable semantics and machine-verifiable contract

      cannot yet be decided from current evidence. It is UNDECIDABLE, so only a named isolated

      BOUNDED_PROBE may run. The probe binds its object, consumer, allowed effects, evidence, sunset and

      rollback, and its real result must cause immediate reevaluation. It cannot become the default path,

      a production call, MATURED_ACTIVE, or completion evidence merely because the probe succeeds.


      These verdicts are local evidence-bound evaluations, not a permanent state machine, third frontier,

      platform, global platform gate, Leg B, second Owner, infinite pre-trigger wait, or reason to stop

      unrelated research. Pre-design judgment decides only from current evidence; after every real probe

      result the same local maturation question must be reevaluated. Do not collapse every pre-trigger

      action into a probe, and do not treat uncertainty as proof that maturation is not required. A

      successful temporary probe, text publish, Skill markdown, or paused candidate package is not

      MATURED_ACTIVE and not Skill-effective without the engineering contract and real consumer

      readback. If later evidence establishes MATURATION_REQUIRED, the next same-dependency production

      call waits for the mature consumer readback; dynamic net benefit then chooses only the

      implementation shape. Codex keeps scientific interpretation, adoption, formal writing and effect

      verification.


      Neutral candidate pool:

      ATOM_NOT_REQUIRED_ALLOWS_ORDINARY_BOUNDED_ACTION=let the proven one-off action proceed under its

      existing bounded contract without mature identity or capability debt;

      ATOM_UNDECIDABLE_ONLY_ALLOWS_BOUNDED_PROBE=restrict the unresolved action to a named isolated probe;

      ATOM_PROBE_RESULT_REEVALUATES_MATURATION=use every real probe result to reevaluate the same local

      maturation question;

      ATOM_VERDICTS_ARE_LOCAL_EVIDENCE_BOUND=keep verdict scope on the named action and current evidence;

      ATOM_UNAFFECTED_RESEARCH_CONTINUES=continue independent positive ResearchFrontier packages;

      ATOM_CODEX_REMAINS_SCIENCE_OWNER=keep scientific judgment, adoption, writing and effect verification

      with Codex;

      ATOM_ALL_PRETRIGGER_ACTIONS_MUST_BE_PROBES=block even a proven one-off ordinary bounded action behind

      a maturation probe;

      ATOM_UNDECIDABLE_MEANS_NOT_REQUIRED=treat missing trigger evidence as proof that no maturation

      obligation can arise;

      ATOM_PROBE_SUCCESS_IS_MATURED_ACTIVE=promote a successful temporary probe without the engineering

      contract and real consumer readback;

      ATOM_VERDICT_CREATES_GLOBAL_WAIT=stop unrelated research on either local verdict;

      ATOM_BUILD_MATURATION_STATE_PLATFORM=create a third frontier, state platform, daemon or control plane;

