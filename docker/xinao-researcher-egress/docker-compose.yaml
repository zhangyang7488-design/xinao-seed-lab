# XINAO dedicated scientific-researcher provider-egress boundary.
# Candidate topology only: Owner provisions after image digest pin + allowlist seal.
# Does NOT reuse Dify ssrf_proxy / ssrf_proxy_network.
#
# Researcher attaches ONLY to xinao_researcher_internal (internal: true).
# Proxy is dual-homed: internal + xinao_provider_egress_ext.
# No host-published proxy port (researcher reaches proxy via Docker DNS on internal net).

name: xinao-researcher-egress

services:
  xinao-researcher-egress-proxy:
    # Authority is immutable digest/image-id from image-pin.v1.json after Owner resolve.
    # Floating ubuntu/squid:latest is observational only and must not remain as authority.
    image: ${XINAO_EGRESS_PROXY_IMAGE:?set XINAO_EGRESS_PROXY_IMAGE to repo@sha256:... or image id}
    container_name: xinao-researcher-egress-proxy
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/log/squid:rw,nosuid,nodev,mode=0755,size=32m
      - /var/spool/squid:rw,nosuid,nodev,mode=0755,size=64m
      - /tmp:rw,nosuid,nodev,size=16m
    volumes:
      - ./squid.conf.template:/etc/squid/squid.conf.template:ro
      - ./docker-entrypoint.sh:/docker-entrypoint-mount.sh:ro
    entrypoint:
      - /bin/bash
      - /docker-entrypoint-mount.sh
    environment:
      HTTP_PORT: "3128"
      COREDUMP_DIR: /var/spool/squid
      # Rendered offline by render_squid_config.py; provision script injects.
      PROVIDER_DSTDOMAIN_ACL: ${XINAO_EGRESS_PROVIDER_DSTDOMAIN_ACL:?render allowlist ACL first}
    networks:
      - xinao_researcher_internal
      - xinao_provider_egress_ext
    labels:
      io.xinao.researcher.egress: "proxy"
      io.xinao.researcher.chain: "dedicated-xinao-science"
      io.xinao.project: "xinao-researcher-egress"
      io.xinao.dify_cross_project: "forbidden"
    # Intentionally no ports: mapping. Internal Docker DNS only.

networks:
  xinao_researcher_internal:
    name: xinao_researcher_internal
    driver: bridge
    internal: true
    labels:
      io.xinao.researcher.egress: "internal"
      io.xinao.project: "xinao-researcher-egress"
  xinao_provider_egress_ext:
    name: xinao_provider_egress_ext
    driver: bridge
    internal: false
    labels:
      io.xinao.researcher.egress: "external"
      io.xinao.project: "xinao-researcher-egress"
