name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single-platform root hygiene: identical Ruff/format/compileall need not
  # run twice on Ubuntu and Windows. Root OS×shard matrix below keeps pytest coverage.
  root-hygiene:
    name: root hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install bounded test environment
        run: uv sync --frozen --extra dev --extra workflow

      # Lint and format both always run so one failure cannot hide the other.
      # Aggregate a non-zero exit after both exact root commands finish.
      - name: Ruff lint and format check
        run: |
          set +e
          uv run ruff check services scripts tests skills/xinao/scripts docker/xinao-researcher
          lint_rc=$?
          uv run ruff format --check services scripts tests skills/xinao/scripts docker/xinao-researcher
          format_rc=$?
          if [ "$lint_rc" -ne 0 ]; then exit "$lint_rc"; fi
          exit "$format_rc"

      - name: Compile retained Python
        run: uv run python -m compileall -q services scripts tests skills/xinao/scripts docker/xinao-researcher

  verify:
    # Six jobs: Ubuntu 3.12 × shards 0/1/2 and Windows 3.11 × shards 0/1/2.
    # Full root pytest coverage is the union of shards per OS; no path filters.
    name: verify (${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }}/${{ matrix.shard_count }})
    needs: root-hygiene
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            shard: 0
            shard_count: 3
          - os: ubuntu-latest
            python-version: "3.12"
            shard: 1
            shard_count: 3
          - os: ubuntu-latest
            python-version: "3.12"
            shard: 2
            shard_count: 3
          - os: windows-latest
            python-version: "3.11"
            shard: 0
            shard_count: 3
          - os: windows-latest
            python-version: "3.11"
            shard: 1
            shard_count: 3
          - os: windows-latest
            python-version: "3.11"
            shard: 2
            shard_count: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install bounded test environment
        run: uv sync --frozen --extra dev --extra workflow

      - name: Run bounded tests
        run: >-
          uv run pytest -q
          -p scripts.pytest_shard
          --shard-count ${{ matrix.shard_count }}
          --shard-index ${{ matrix.shard }}
          --basetemp "${{ runner.temp }}/pytest-shard-${{ matrix.shard }}"

  project-verify:
    name: project (${{ matrix.project }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dual-brain-coordination
            path: projects/dual-brain-coordination
            os: windows-latest
            pytest_args: -q
            ruff_paths: .
          - project: xinao-market-lab
            path: projects/xinao-market-lab
            os: ubuntu-latest
            pytest_args: -q
            ruff_paths: .
          - project: g4-hidden-capability-seam
            path: projects/g4-hidden-capability-seam
            os: windows-latest
            pytest_args: -q
            ruff_paths: src adapters tests
          # AF-005 single_home: exercise the exact package cone and durable unit suite on PRs.
          - project: xinao-discovery
            path: xinao_discovery
            os: ubuntu-latest
            pytest_args: -q tests/unit/single_home
            ruff_paths: src/xinao/single_home tests/unit/single_home
          - project: discovery-capability
            path: xinao_discovery
            os: ubuntu-latest
            pytest_args: -q tests/unit/capability
            ruff_paths: src/xinao/capability tests/unit/capability
          - project: discovery-science-parent
            path: xinao_discovery
            os: ubuntu-latest
            pytest_args: -q tests/unit/science tests/contract/test_world.py
            ruff_paths: >-
              src/xinao/science src/xinao/world/builder.py
              tests/unit/science tests/contract/test_world.py
          - project: discovery-domain-admission
            path: xinao_discovery
            os: ubuntu-latest
            pytest_args: >-
              -q tests/unit/admission tests/unit/ledger/test_formal_vertical_registration.py
            ruff_paths: >-
              src/xinao/admission scripts/register/formal_vertical.py
              tests/unit/admission tests/unit/ledger/test_formal_vertical_registration.py
          - project: discovery-operational-assurance
            path: xinao_discovery
            os: ubuntu-latest
            pytest_args: -q tests/unit/assurance
            ruff_paths: src/xinao/assurance tests/unit/assurance
          # Shadow lifecycle product cone: continuous portfolios changed this path
          # but no project-verify row previously scheduled unit coverage.
          - project: discovery-shadow-lifecycle
            path: xinao_discovery
            os: ubuntu-latest
            pytest_args: -q tests/unit/shadow_lifecycle
            ruff_paths: src/xinao/shadow_lifecycle tests/unit/shadow_lifecycle
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pinned AMQ prerequisite
        if: matrix.project == 'dual-brain-coordination'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'amq_0.42.0_windows_amd64.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'amq_0.42.0'
          $binRoot = 'D:\XINAO_RESEARCH_RUNTIME\tools\amq\bin'
          $canaryRoot = 'D:\XINAO_RESEARCH_RUNTIME\state\dual_brain_coordination_canary\amq'
          Invoke-WebRequest `
            -Uri 'https://github.com/avivsinai/agent-message-queue/releases/download/v0.42.0/amq_0.42.0_windows_amd64.zip' `
            -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne 'E155F108C1ACFB23EE0245E6CA1A89BFFBB886B45B1F8A309D98CF162F457EC3') {
            throw 'AMQ release archive hash mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $source = Get-ChildItem -LiteralPath $extract -Filter 'amq.exe' -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $source) {
            throw 'AMQ release archive does not contain amq.exe'
          }
          New-Item -ItemType Directory -Path $binRoot, $canaryRoot -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $binRoot 'amq.exe')
          $amq = Join-Path $binRoot 'amq.exe'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $amq).Hash -ne 'CCC3F59F00C8DD461E80229A38828703A229B77530B6810E620B0BB49E5DD9CE') {
            throw 'AMQ executable hash mismatch'
          }
          & $amq --version

      - name: Install locked project environment
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check ${{ matrix.ruff_paths }}

      - name: Ruff format check
        run: uv run ruff format --check ${{ matrix.ruff_paths }}

      - name: Run project tests
        run: uv run pytest ${{ matrix.pytest_args }}
